services:
  - type: web
    name: qr-testing-json
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: SESSION_SECRET
        generateValue: true
    disk:
      name: qr-testing-data
      mountPath: /opt/render/project/src/data
      sizeGB: 1
