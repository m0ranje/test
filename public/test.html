<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Прохождение теста</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <main class="page">
    <header class="topbar">
      <a class="brand" href="/">
        <span class="brand-mark">QR</span>
        <span>
          <h1 data-page-title>Тестирование</h1>
          <p>Введите имя и ответьте на вопросы</p>
        </span>
      </a>
    </header>

    <form class="form" data-test-form>
      <section class="card">
        <div class="card-body form">
          <div class="field">
            <label for="participantName">Ваше имя</label>
            <input class="input" id="participantName" name="participantName" placeholder="Например: Иван Иванов" autocomplete="name" required>
          </div>
        </div>
      </section>
      <div data-question-list class="form"></div>
      <button class="button" type="submit" data-submit-test>Отправить ответы</button>
    </form>
    <div class="message" data-message></div>
  </main>
  <script src="/app.js"></script>
</body>
</html>
